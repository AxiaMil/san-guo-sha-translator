<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        const t = localStorage.getItem("sha-theme");
        document.documentElement.dataset.theme =
          t === "Dark" ||
          ((!t || t === "System") &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafafa" />
    <meta
      name="description"
      content="Scan San Guo Sha cards, identify generals, and read their skills in English. A phone-friendly companion for your next game."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SHA — San Guo Sha Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
